<form [formGroup]="gameForm" (ngSubmit)="onSubmit()">
    <div class="h-screen bg-gray-100 p-4">
        <div class="h-full flex gap-4">
            <aside *ngIf="activeTool === 'placement'" class="bg-white border rounded-lg p-4 flex flex-col basis-1/4">
                <h3 class="text-sm font-semibold mb-4 text-gray-700">Matériaux</h3>
                <div class="flex flex-col gap-2">
                    <!--                <button type="button" (click)="selectMaterial('base')"  class="px-3 py-2 rounded border text-center"-->
                    <!--                        [class.bg-blue-500]="selectedMaterial === 'base'"-->
                    <!--                        [class.text-white]="selectedMaterial === 'base'"-->
                    <!--                        [class.hover:bg-gray-100]="selectedMaterial !== 'base'"-->
                    <!--                >-->
                    <!--                    Base-->
                    <!--                </button>-->
                    <button
                        type="button"
                        (click)="selectMaterial(importedCellType.Empty)"
                        class="px-3 py-2 rounded border text-center"
                        [class.bg-blue-500]="selectedMaterial === importedCellType.Empty"
                        [class.text-white]="selectedMaterial === importedCellType.Empty"
                        [class.hover:bg-gray-100]="selectedMaterial !== importedCellType.Empty"
                    >
                        Gazon
                    </button>
                    <button
                        type="button"
                        (click)="selectMaterial(importedCellType.Wall)"
                        class="px-3 py-2 rounded border text-center"
                        [class.bg-blue-500]="selectedMaterial === importedCellType.Wall"
                        [class.text-white]="selectedMaterial === importedCellType.Wall"
                        [class.hover:bg-gray-100]="selectedMaterial !== importedCellType.Wall"
                    >
                        Mur
                    </button>
                    <button
                        type="button"
                        (click)="selectMaterial(importedCellType.Water)"
                        class="px-3 py-2 rounded border text-center"
                        [class.bg-blue-500]="selectedMaterial === importedCellType.Water"
                        [class.text-white]="selectedMaterial === importedCellType.Water"
                        [class.hover:bg-gray-100]="selectedMaterial !== importedCellType.Water"
                    >
                        Eau
                    </button>
                    <button
                        type="button"
                        (click)="selectMaterial(importedCellType.Ice)"
                        class="px-3 py-2 rounded border text-center"
                        [class.bg-blue-500]="selectedMaterial === importedCellType.Ice"
                        [class.text-white]="selectedMaterial === importedCellType.Ice"
                        [class.hover:bg-gray-100]="selectedMaterial !== importedCellType.Ice"
                    >
                        Glace
                    </button>
                    <button
                        type="button"
                        (click)="selectMaterial(importedCellType.OpenDoor)"
                        class="px-3 py-2 rounded border text-center"
                        [class.bg-blue-500]="selectedMaterial === importedCellType.OpenDoor"
                        [class.text-white]="selectedMaterial === importedCellType.OpenDoor"
                        [class.hover:bg-gray-100]="selectedMaterial !== importedCellType.OpenDoor"
                    >
                        Porte
                    </button>
                </div>
            </aside>
            <aside *ngIf="activeTool === 'objects'" class="bg-white border rounded-lg p-4 flex flex-col basis-1/4">
                <h3 class="text-sm font-semibold mb-4 text-gray-700">Objets</h3>
                <div class="flex flex-col gap-2">
                    <button
                        type="button"
                        (click)="selectObject(importedItemType.LifeSanctuary)"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-50"
                        [class.bg-blue-500]="selectedObject === importedItemType.LifeSanctuary"
                        [class.text-white]="selectedObject === importedItemType.LifeSanctuary"
                    >
                        <span>Sanctuaire de vie |</span>
                        <span class="text-sm text-red-500"> {{ remainingHealSanctuaries }} restant </span>
                    </button>
                    <button
                        type="button"
                        (click)="selectObject(importedItemType.FightSanctuary)"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-50"
                        [class.bg-blue-500]="selectedObject === importedItemType.FightSanctuary"
                        [class.text-white]="selectedObject === importedItemType.FightSanctuary"
                    >
                        <span>Sanctuaire de combat |</span>
                        <span class="text-sm text-red-500"> {{ remainingFightSanctuaries }} restant </span>
                    </button>
                    <button
                        type="button"
                        (click)="selectObject(importedItemType.StartingPosition)"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-50"
                        [class.bg-blue-500]="selectedObject === importedItemType.StartingPosition"
                        [class.text-white]="selectedObject === importedItemType.StartingPosition"
                    >
                        <span>Spawnpoint |</span>
                        <span class="text-sm text-red-500"> {{ remainingSpawnpoints }} restant </span>
                    </button>
                    <button
                        *ngIf="isCTF"
                        type="button"
                        (click)="selectObject(importedItemType.Flag)"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-50"
                        [class.bg-blue-500]="selectedObject === importedItemType.Flag"
                        [class.text-white]="selectedObject === importedItemType.Flag"
                    >
                        <span>Drapeau |</span>
                        <span class="text-sm text-red-500"> {{ remainingFlags }} restant </span>
                    </button>
                </div>
            </aside>

            <main class="bg-gray-50 rounded-xl border flex flex-col overflow-hidden flex-1">
                <div class="h-12 px-4 border-b flex items-center justify-center gap-2 bg-white">
                    <button type="button" (click)="setGrid(10)" class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200">10×10</button>
                    <button type="button" (click)="setGrid(15)" class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200">15×15</button>
                    <button type="button" (click)="setGrid(20)" class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200">20×20</button>
                </div>

                <div class="flex-1 flex items-center justify-center p-4">
                    <div
                        id="grid-container"
                        class="grid bg-gray-400 aspect-square h-full auto-rows-fr select-none"
                        [style.gridTemplateColumns]="'repeat(' + gridSize + ', 1fr)'"
                    >
                        @for (row of gameCells; track $index; let rowIndex = $index) { @for (cell of row; track $index; let i = $index) {
                        <div (mousedown)="onMouseDown(rowIndex, i)" (mouseenter)="onMouseMove(rowIndex, i)" class="relative select-none">
                            <div
                                class="absolute inset-0"
                                [ngClass]="{
                                    'bg-[url(/assets/wallTest.png)] bg-no-repeat bg-cover': cell === importedCellType.Wall,
                                    'bg-[url(/assets/water.png)] bg-no-repeat bg-cover': cell === importedCellType.Water,
                                    'bg-[url(/assets/ice.png)] bg-no-repeat bg-cover': cell === importedCellType.Ice,
                                    'bg-[url(/assets/openDoor.png)] bg-size-[100%_100%]': cell === importedCellType.OpenDoor,
                                    'bg-[url(/assets/doorClosed.png)] bg-no-repeat bg-center bg-contain': cell === importedCellType.ClosedDoor,
                                    'bg-[url(/assets/grass-img.png)] bg-no-repeat bg-cover': cell === importedCellType.Empty
                                }"
                            ></div>

                            <div
                                *ngIf="objects[i]"
                                class="absolute inset-0 z-10"
                                [ngStyle]="
                                    objects[i] === importedItemType.FightSanctuary || objects[i] === importedItemType.LifeSanctuary
                                        ? {
                                              backgroundImage:
                                                  objects[i] === importedItemType.FightSanctuary
                                                      ? 'url(/assets/fightSanctuary.png)'
                                                      : 'url(/assets/healSanctuary.png)',
                                              backgroundSize: '200% 200%',
                                              backgroundPosition: getSanctuaryBgPosition(i)
                                          }
                                        : null
                                "
                                [ngClass]="{
                                    'bg-[url(/assets/flag.png)] bg-size-[100%_100%]': objects[i] === importedItemType.Flag,
                                    'bg-[url(/assets/spawnpoint.png)] bg-cover': objects[i] === importedItemType.StartingPosition
                                }"
                            ></div>
                        </div>
                        } }
                    </div>
                </div>
                <div class="h-12 px-4 border-t flex items-center justify-center gap-2 bg-white">
                    <button type="button" (click)="resetGrid()" class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200">Reset</button>
                    <button class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200" type="submit">Sauvegarder</button>
                    <button (click)="changeMode()" class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200">
                        <span>Changer le mode de jeu |</span>
                        <span class="text-sm text-blue-500"> Mode : {{ currentMode }} </span>
                    </button>
                </div>
            </main>

            <aside class="bg-white border rounded-lg p-4 flex flex-col justify-between basis-1/4">
                <div class="flex flex-col gap-2">
                    <h3 class="text-sm font-semibold mb-4 text-gray-700">Outils</h3>

                    <button
                        type="button"
                        (click)="selectTool('placement')"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-200"
                        [ngClass]="{
                            'bg-blue-500 text-white': activeTool === 'placement'
                        }"
                    >
                        Placement
                    </button>

                    <button
                        type="button"
                        (click)="selectTool('objects')"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-200"
                        [ngClass]="{
                            'bg-blue-500 text-white': activeTool === 'objects'
                        }"
                    >
                        Objets
                    </button>

                    <button
                        type="button"
                        (click)="selectTool('erase')"
                        class="px-3 py-2 rounded border text-center hover:bg-gray-200"
                        [ngClass]="{
                            'bg-red-500 text-white': activeTool === 'erase'
                        }"
                    >
                        Effacer
                    </button>
                </div>

                <div class="flex flex-col gap-2">
                    <div class="flex flex-col">
                        <label>Titre</label>
                        <input formControlName="gameTitle" type="text" class="border rounded px-2 py-1" name="editionTitle" />
                    </div>

                    <div class="flex flex-col">
                        <label>Description</label>
                        <textarea formControlName="description" class="border rounded px-2 py-1" rows="4" name="editionDescription"></textarea>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</form>
