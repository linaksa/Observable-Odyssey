<div class="content">
    <div class="flex justify-center">
        <h4 class="page-title">Création d'une partie</h4>
    </div>

    <div class="flex justify-between mb-2">
        <div>Jeux disponibles</div>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z4">
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef>Image</th>
            <td mat-cell *matCellDef="let element">
                <div matButton="elevated" #tooltip="matTooltip" matTooltip="{{ element.description }}">
                    <img class="w-[100px] h-auto m-5 aspect-square object-cover" [src]="element.image" />
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="gameTitle">
            <th mat-header-cell *matHeaderCellDef>Titre</th>
            <td mat-cell *matCellDef="let element">{{ element.gameTitle }}</td>
        </ng-container>

        <ng-container matColumnDef="size">
            <th mat-header-cell *matHeaderCellDef>Taille</th>
            <td mat-cell *matCellDef="let element">{{ element.board.cells.length }}x{{ element.board.cells.length }}</td>
        </ng-container>

        <ng-container matColumnDef="mode">
            <th mat-header-cell *matHeaderCellDef>Mode</th>
            <td mat-cell *matCellDef="let element">{{ element.gameMode }}</td>
        </ng-container>

        <ng-container matColumnDef="lastEdited">
            <th mat-header-cell *matHeaderCellDef>Dernière modification</th>
            <td mat-cell *matCellDef="let element">{{ element.lastModifiedDate | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
                <button mat-raised-button color="primary" routerLink="/form">Créer une partie</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
