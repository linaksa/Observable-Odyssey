<div class="content">
    <div class="flex justify-center">
        <h4 class="page-title">Création d'une partie</h4>
    </div>

    <div class="flex justify-between mb-2">
        <div>Jeux disponibles</div>
    </div>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z4">
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef>Image</th>
            <td mat-cell *matCellDef="let element">
                <div
                    matButton="elevated"
                    #tooltip="matTooltip"
                    matTooltip="Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen book. It has survived not only five centuries, but also the leap into electronic typesetting, remaining essentially unchanged."
                >
                    <img [src]="element.image" />
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="size">
            <th mat-header-cell *matHeaderCellDef>Taille</th>
            <td mat-cell *matCellDef="let element">{{ element.size }}</td>
        </ng-container>

        <ng-container matColumnDef="mode">
            <th mat-header-cell *matHeaderCellDef>Mode</th>
            <td mat-cell *matCellDef="let element">{{ element.mode }}</td>
        </ng-container>

        <ng-container matColumnDef="lastEdited">
            <th mat-header-cell *matHeaderCellDef>Dernière modification</th>
            <td mat-cell *matCellDef="let element">{{ element.lastEdited }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
                <button mat-raised-button color="primary" (click)="openDialog()">Nouvelle partie</button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
