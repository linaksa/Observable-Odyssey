<div class="flex flex-col min-h-screen p-4">
    <app-game-infos></app-game-infos>
    <div class="mt-4 mb-2 rounded-lg bg-[#233f74] p-3 text-center text-white">
        @if (currentPlayerName) {
            <span>C'est le tour de {{ currentPlayerName }}</span>
        } @else {
            <span>Chargement du tour en cours...</span>
        }
        @if (gameTurnService.turnTimeLeftSeconds !== null) {
            <span class="ml-2">({{ gameTurnService.turnTimeLeftSeconds }}s)</span>
        }
        @if (gameTurnService.isTurnPreparing) {
            <span class="ml-2 text-yellow-200">Preparation...</span>
        }
        <button
            class="ml-4 rounded bg-[#182b50] px-3 py-1 text-sm text-white disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="!canEndTurn"
            (click)="endTurn()"
        >
            Finir mon tour
        </button>
    </div>
    <div class="flex grow gap-4">
        <div class="flex flex-col basis-3/4 grow gap-4">
            <div class="flex bg-[#233f74] rounded-lg p-4">
                <app-player-info></app-player-info>
            </div>
            <div class="bg-[#233f74] rounded-lg grow">
                <app-game></app-game>
            </div>
        </div>
        <div class="flex flex-col justify-between basis-1/4 p-4 bg-[#233f74] rounded-lg">
            <div>
                <app-player-list></app-player-list>
            </div>
            <div>
                <app-chat-panel></app-chat-panel>
            </div>
        </div>
    </div>
</div>
