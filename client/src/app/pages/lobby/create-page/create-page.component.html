<div class="content">
    <app-nav-buttons />
    <app-page-title title="Création d'une partie" />

    <app-game-table [isLoading]="gameTableService.isLoading()" [games]="gameTableService.tableData" [actions]="actions"></app-game-table>
</div>

<ng-template #actions let-game>
    <button class="btn btn-blue h-full min-w-48" [routerLink]="['/form', game._id]">Créer une partie</button>
</ng-template>
