<div class="content">
    @if (activeGameService.isLoading() || !this.activeGameService.activeGame) {
        <div class="flex flex-1 justify-center items-center">
            <app-loading-overlay
                loadingText="Chargement de la partie..."
                class="flex flex-col gap-8 items-center justify-center"
            ></app-loading-overlay>
        </div>

        <div class="absolute left-0 bottom-4 w-full flex justify-center">
            @if (showButton) {
                <button class="btn" routerLink="/home">Retour vers la vue initiale</button>
            }
        </div>
    } @else {
        @if (isVirtualPlayerDialogOpen()) {
            <div class="fixed inset-0 flex items-center justify-center w-full h-full bg-black/70 z-10" (click)="isVirtualPlayerDialogOpen.set(false)">
                <app-virtual-player-dialog
                    (closeDialog)="isVirtualPlayerDialogOpen.set(false)"
                    (click)="$event.stopPropagation()"
                ></app-virtual-player-dialog>
            </div>
        }

        <app-nav-buttons />
        <app-page-title title="Vue d'attente" />

        <section class="flex min-h-0 flex-col justify-center gap-4 lg:h-[calc(100vh-14rem)] lg:min-h-[34rem] lg:flex-row">
            <app-wait-player-list
                class="flex min-h-0 flex-1 flex-col gap-4 overflow-hidden rounded-lg bg-[#233f74] p-4"
                [players]="activeGameService.activeGame.players"
                [localPlayer]="localPlayer"
                [organizerName]="activeGameService.activeGame.organizerName"
                (openVirtualPlayerDialog)="isVirtualPlayerDialogOpen.set(true)"
            />

            <app-wait-game-grid class="flex min-h-0 flex-2 flex-col gap-4 overflow-hidden rounded-lg bg-[#233f74] p-4" />

            <app-wait-chat-sidebar
                class="flex min-h-0 flex-1 flex-col gap-4 overflow-hidden rounded-lg bg-[#233f74] p-4"
                [localPlayer]="localPlayer"
            />
        </section>
    }
</div>
