<div class="min-h-screen bg-[#f6f7fb] text-[#0f172a]">
    <div class="min-h-screen max-w-[900px] mx-auto px-5 pt-12 pb-7 flex flex-col items-center justify-between">
        <h1 class="mb-4 text-center font-extrabold text-[2.5rem]">{{ title }}</h1>
        <img class="w-[140px] h-auto rounded-[12px] shadow-[0_10px_24px_rgba(0,0,0,0.12)] mb-[18px]" src="https://bit.ly/3QofL1J" alt="Logo Projet" />
        <section
            id="server-message"
            class="w-full max-w-[520px] bg-white border border-slate-200 rounded-[12px] p-5 flex flex-col items-center justify-between"
        >
            <div class="flex flex-col items-center justify-between">
                <button class="btn w-full mt-3 py-3 px-4">Joindre une partie</button>
                <button class="btn w-full mt-3 py-3 px-4" routerLink="/create">Créer une partie</button>
                <button class="btn w-full mt-3 py-3 px-4" routerLink="/admin">Administrer les jeux</button>
            </div>
        </section>

        <footer class="w-full text-center mt-7 pt-4 border-t border-slate-200">
            <h4 class="my-1 text-[#533af1]">Équipe 301</h4>
            <p>
                <span class="odd:text-blue-600 even:text-[#0a2663]">Lina Aksas</span>,
                <span class="odd:text-blue-600 even:text-[#0a2663]">Félix Cadieux</span>,
                <span class="odd:text-blue-600 even:text-[#0a2663]">Alex Caya</span>,
                <span class="odd:text-blue-600 even:text-[#0a2663]">Jérémie Lestage</span>,
                <span class="odd:text-blue-600 even:text-[#0a2663]">Victor Paul-Hus-Côté</span>,
                <span class="odd:text-blue-600 even:text-[#0a2663]">Thomas Pronovost</span>
            </p>
        </footer>
    </div>
</div>
