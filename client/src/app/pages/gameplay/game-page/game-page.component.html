<div class="flex flex-col min-h-screen p-4">
    <app-game-infos></app-game-infos>
    <div class="mt-4 mb-2 rounded-lg bg-[#233f74] p-3 text-center text-white">
        <app-turn-status [data]="turnStatusData" (endTurnRequested)="endTurn()"></app-turn-status>
    </div>
    <div class="flex grow gap-4">
        <div class="flex flex-col basis-3/4 grow gap-4">
            <div class="flex bg-[#233f74] rounded-lg p-4">
                <app-player-info></app-player-info>
            </div>
            <div class="bg-[#233f74] rounded-lg grow">
                <app-game></app-game>
            </div>
        </div>
        <div class="flex flex-col justify-between basis-1/4 p-4 bg-[#233f74] rounded-lg">
            <div>
                <app-player-list></app-player-list>
            </div>
            <div>
                <app-chat-panel></app-chat-panel>
            </div>
        </div>
    </div>
</div>
@if (isGameFinished) {
    <app-game-ended></app-game-ended>
}
@if (this.activeGameService.activeGame.currentAttack !== null) {
    <app-combat-mode></app-combat-mode>
}

<div class="fixed bottom-6 left-6">
    <app-game-attack></app-game-attack>
</div>
