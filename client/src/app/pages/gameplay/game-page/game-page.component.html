<div class="content min-h-screen">
    @if (isLoading()) {
        <div class="flex flex-1 justify-center items-center">
            <app-loading-overlay
                loadingText="Chargement de la partie..."
                class="flex flex-col gap-8 items-center justify-center"
            ></app-loading-overlay>
        </div>

        <div class="absolute left-0 bottom-4 w-full flex justify-center">
            @if (showButton()) {
                <button class="btn" routerLink="/home">Retour vers la vue initiale</button>
            }
        </div>
    } @else {
        <app-nav-buttons textBack="Abandonner la partie" />
        <app-page-title title="Vue de jeu" />

        <section class="flex flex-col justify-center gap-4 xl:flex-1 xl:min-h-0 xl:flex-row">
            <app-game-action-panel class="flex min-h-0 flex-1 flex-col gap-4 overflow-hidden rounded-lg bg-[#233f74] p-4 xl:min-h-full" />

            <app-game-grid-panel class="flex min-h-0 flex-2 flex-col gap-4 overflow-hidden rounded-lg bg-[#233f74] p-4 xl:min-h-full" />

            <app-game-info-panel class="flex min-h-0 flex-1 flex-col gap-4 overflow-hidden rounded-lg bg-[#233f74] p-4 xl:min-h-full" />
        </section>

        @if (isGameFinished) {
            <app-game-ended />
        }
    }
</div>
