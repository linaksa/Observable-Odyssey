<div class="flex h-full min-h-0 w-full min-w-0 flex-1 flex-col gap-4 overflow-hidden rounded-lg border border-transparent text-white">
    <div class="rounded-lg border border-white/10 bg-white/5 px-4 py-3 text-white">
        <p class="text-xs uppercase tracking-widest text-white/60">Journal de partie · {{ gameLogs.length }} logs</p>
        <p class="text-lg font-semibold tracking-wider">Historique</p>
    </div>

    <div
        #journalScrollContainer
        (scroll)="onScroll()"
        class="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto rounded-lg border border-white/10 bg-black/10 p-3"
        aria-label="Journal de partie"
        aria-live="polite"
        role="log"
    >
        @if (gameLogs.length === 0) {
            <div class="rounded-lg border border-dashed border-white/10 bg-white/5 p-3 text-sm text-white/60">
                {{ journalEmptyMessage }}
            </div>
        }
        @for (log of gameLogs; track $index) {
            <div class="rounded-lg border border-white/10 bg-white/5 p-3 text-sm text-white shadow-sm">
                <div class="text-xs uppercase tracking-wide text-white/60">{{ log.postedAt | date: journalDateFormat }}</div>
                <div class="mt-1 whitespace-pre-wrap leading-5">{{ log.message }}</div>
            </div>
        }
    </div>
</div>
