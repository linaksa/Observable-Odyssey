<div
    class="max-w-xs h-fit wrap-break-word rounded-lg border border-black/5 p-2 text-gray-900 shadow-sm"
    [style.background-color]="isSelf() ? 'lightblue' : 'lightgray'"
    [class.self-end]="isSelf()"
    [class.self-start]="!isSelf()"
>
    <div class="text-xs font-medium tracking-wide text-gray-700">{{ message().author }} - {{ message().postedAt | date: 'HH:mm:ss' }}</div>
    <div class="mt-1 whitespace-pre-wrap text-sm leading-5">{{ message().content }}</div>
</div>
