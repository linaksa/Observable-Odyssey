<form [formGroup]="form">
    <div class="w-full">
        <label for="playerName" class="text-white tracking-wider">Nom du personnage</label>
        <input
            id="playerName"
            type="text"
            [attr.maxlength]="playerNameMaxLength"
            placeholder="Entrez votre nom"
            formControlName="playerName"
            class="input w-full"
        />
    </div>
</form>
