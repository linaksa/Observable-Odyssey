<form [formGroup]="gameEditFormService.form" (ngSubmit)="submitRequested.emit()" class="flex grow flex-col gap-4 mb-2">
    <div class="w-full">
        <label for="gameTitle" class="text-white tracking-wider">Titre</label>
        <input
            id="gameTitle"
            type="text"
            [attr.maxlength]="maxTitleLength"
            placeholder="Entrez un titre"
            formControlName="gameTitle"
            class="input w-full"
            [class.field-error]="titleHasError()"
            [attr.aria-invalid]="titleHasError() ? 'true' : null"
        />
        @if (titleHasError()) {
            <p class="text-red-500 text-sm mt-1">{{ titleErrorMessage() }}</p>
        }
    </div>

    <div class="w-full">
        <label for="description" class="text-white tracking-wider">Description</label>
        <textarea
            id="description"
            [attr.maxlength]="maxDescriptionLength"
            placeholder="Entrez une description"
            formControlName="description"
            class="textarea w-full"
            [class.field-error]="descriptionHasError()"
            [attr.aria-invalid]="descriptionHasError() ? 'true' : null"
        ></textarea>
        @if (descriptionHasError()) {
            <p class="text-red-500 text-sm mt-1">{{ descriptionErrorMessage() }}</p>
        }
    </div>
</form>

<div class="border-t border-white"></div>

@if (gameEditFormService.formErrors().length > 0) {
    <div class="bg-red-900/30 border border-red-500 text-red-500 text-sm p-2 text-center">
        @for (error of gameEditFormService.formErrors(); track $index) {
            <p>{{ error }}</p>
        }
    </div>
}

<div class="flex shrink flex-col justify-center gap-2">
    <button type="button" class="btn btn-red" (click)="revertRequested.emit()">Rétablir</button>

    <button
        type="button"
        class="btn btn-green h-12 inline-flex items-center justify-center gap-2"
        [disabled]="gameEditFormService.isSubmitting()"
        (click)="submitRequested.emit()"
    >
        @if (gameEditFormService.isSubmitting()) {
            <img
                src="assets/loading/cogwheel.png"
                alt="Chargement"
                class="h-full w-auto object-contain animate-[spin_2s_steps(16)_infinite] select-none [image-rendering:pixelated]"
                draggable="false"
            />
        }
        <span>Confirmer</span>
    </button>
</div>
