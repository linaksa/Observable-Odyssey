<table mat-table [dataSource]="gameTableService.tableData" class="mat-elevation-z4">
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef>Image</th>
            <td mat-cell *matCellDef="let element">
                <div matButton="elevated" #tooltip="matTooltip"
                    [matTooltip]="element.description">
                    <img class="w-24 h-24 m-4" [src]="element.preview" />
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="gameTitle">
            <th mat-header-cell *matHeaderCellDef>Titre</th>
            <td mat-cell *matCellDef="let element"> {{element.gameTitle}} </td>
        </ng-container>

        <ng-container matColumnDef="size">
            <th mat-header-cell *matHeaderCellDef>Taille</th>
            <td mat-cell *matCellDef="let element"> {{element.board.cells.length}}x{{element.board.cells.length}} </td>
        </ng-container>

        <ng-container matColumnDef="mode">
            <th mat-header-cell *matHeaderCellDef>Mode</th>
            <td mat-cell *matCellDef="let element"> {{element.gameMode}} </td>
        </ng-container>

        <ng-container matColumnDef="lastEdited">
            <th mat-header-cell *matHeaderCellDef> Dernière modification </th>
            <td mat-cell *matCellDef="let element"> {{element.lastModifiedDate| date:'dd/MM/yyyy'}} </td>
        </ng-container>

        <ng-container matColumnDef="visibility">
            <th mat-header-cell *matHeaderCellDef>Public</th>
            <td mat-cell *matCellDef="let element">
                <form>
                    <mat-checkbox (change)="toggleVisibility($event, element)" name="visibility" [checked]="gameIsViewable(element)"></mat-checkbox>
                </form>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
                <button mat-button class="btn" [routerLink]="['/edit']">
                    <mat-icon fontIcon="edit"></mat-icon>
                </button>
                <!-- ajouter (click)="deleteGame(element)" -->
                <button mat-button color="warn" class="btn">
                    <mat-icon fontIcon="delete"></mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="gameTableService.displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: gameTableService.displayedColumns;"></tr>
    </table>
