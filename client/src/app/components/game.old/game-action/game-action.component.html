<button
    (click)="toggle()"
    class="w-30 h-30 flex items-center justify-center rounded-full border font-semibold"
    [disabled]="!gameTurnService.canEndTurn || hasUsedActionThisTurn()"
    [class.bg-red-600]="this.activeGameService.actionMode() && !hasUsedActionThisTurn() && gameTurnService.canEndTurn"
    [class.text-white]="this.activeGameService.actionMode() && !hasUsedActionThisTurn() && gameTurnService.canEndTurn"
    [class.border-red-700]="this.activeGameService.actionMode() && !hasUsedActionThisTurn() && gameTurnService.canEndTurn"
    [class.bg-gray-200]="!this.activeGameService.actionMode() || !gameTurnService.canEndTurn || hasUsedActionThisTurn()"
    [class.text-gray-800]="!this.activeGameService.actionMode() || !gameTurnService.canEndTurn || hasUsedActionThisTurn()"
    [class.border-gray-400]="!this.activeGameService.actionMode() || !gameTurnService.canEndTurn || hasUsedActionThisTurn()"
    [class.opacity-50]="!gameTurnService.canEndTurn || hasUsedActionThisTurn()"
    [class.cursor-not-allowed]="!gameTurnService.canEndTurn || hasUsedActionThisTurn()"
>
    Action
</button>
