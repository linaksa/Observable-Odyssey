<div
    id="cell-wrapper"
    (mousedown)="mousedDownCell.emit($event)"
    (mouseenter)="mouseEnterCell.emit($event)"
    (contextmenu)="$event.preventDefault()"
    class="relative select-none w-full h-full"
>
    <div id="cell" [ngClass]="backgroundImage" class="absolute inset-0 bg-no-repeat bg-cover"></div>

    @if (item) {
        <div id="item" [ngClass]="backgroundImageForObject" class="absolute inset-0 z-10" [ngStyle]="objectExtraStyles"></div>
    }
</div>
