<form [formGroup]="gameEditFormService.form" (ngSubmit)="submitGameForm()">

    @if(gameEditFormService.isSubmitting) {
        <div class="fixed w-screen h-screen top-0 left-0 opacity-50 bg-gray-500 z-50">
            <div class="size-8 border-4 border-black border-t-transparent rounded-full animate-spin relative top-[50%] left-[50%]"></div>
        </div>
    }

    <div class="flex flex-col gap-2">
        <div class="flex flex-col">
            <label>Titre</label>
            <input formControlName="gameTitle" type="text" class="border rounded px-2 py-1" name="editionTitle"/>
        </div>

        <div class="flex flex-col">
            <label>Description</label>
            <textarea formControlName="description"  class="border rounded px-2 py-1" rows="4" name="editionDescription"></textarea>
        </div>
        <div class="flex flex-col">
            <label>Mode de jeu</label>
            <select formControlName="gameMode" class="border" (change)="onGameModeChange.emit($event)">
                @for (mode of gameEditFormService.availableGameModes; track $index;) {
                    <option [value]="mode">{{ gameEditFormService.availableGameModeLabels[mode] }}</option>
                }
            </select>
        </div>
    </div>

    <div class="mt-auto py-4 border-t">
            <div class="text-xs text-gray-600 space-y-1 max-h-64 overflow-y-auto">
                @for (log of gameEditFormService.formErrors; track $index) {
                    @if (!gameEditFormService.formValid) {
                        <div class="text-red-600">{{ log }}</div>
                    }
                }
            </div>
    </div>

    <button class="px-3 py-1.5 rounded border text-sm hover:bg-gray-200" type="submit">Sauvegarder</button>
</form>
