<div class="flex flex-col text-white gap-4">
    <p class="text-2xl">Liste des joueurs</p>

    <table class="text-center">
        <thead>
            <tr>
                <th></th>
                <th></th>
                <th>
                    <button class="flex cursor-pointer items-center" (click)="orderPlayers(availableStatOrderArgs.NCombats)">
                        Combats <img class="w-4 h-4 ml-1" [src]="getOrderDirectionIconPath(availableStatOrderArgs.NCombats)" />
                    </button>
                </th>
                <th>
                    <button class="flex cursor-pointer items-center" (click)="orderPlayers(availableStatOrderArgs.NVictories)">
                        Victoires <img class="w-4 h-4 ml-1" [src]="getOrderDirectionIconPath(availableStatOrderArgs.NVictories)" />
                    </button>
                </th>
                <th>
                    <button class="flex cursor-pointer items-center" (click)="orderPlayers(availableStatOrderArgs.NDefeats)">
                        Défaites <img class="w-4 h-4 ml-1" [src]="getOrderDirectionIconPath(availableStatOrderArgs.NDefeats)" />
                    </button>
                </th>
                <th>
                    <button class="flex cursor-pointer items-center" (click)="orderPlayers(availableStatOrderArgs.NDamageTaken)">
                        PDV perdus <img class="w-4 h-4 ml-1" [src]="getOrderDirectionIconPath(availableStatOrderArgs.NDamageTaken)" />
                    </button>
                </th>
                <th>
                    <button class="flex cursor-pointer items-center" (click)="orderPlayers(availableStatOrderArgs.NDamageDealt)">
                        Dommages totaux <img class="w-4 h-4 ml-1" [src]="getOrderDirectionIconPath(availableStatOrderArgs.NDamageDealt)" />
                    </button>
                </th>
                <th>
                    <button class="flex cursor-pointer items-center" (click)="orderPlayers(availableStatOrderArgs.NVisitedCells)">
                        % tuiles visitées <img class="w-4 h-4 ml-1" [src]="getOrderDirectionIconPath(availableStatOrderArgs.NVisitedCells)" />
                    </button>
                </th>
            </tr>
        </thead>
        <tbody>
            @for (player of orderedPlayers; track $index) {
                <tr>
                    <td>
                        <img [src]="getAvatarUrl(player)" class="w-16 h-16 p-2 rounded-full bg-[#1e3a70] object-contain shrink-0" />
                    </td>
                    <td>{{ player.name }}</td>
                    <td>{{ player.nCombats }}</td>
                    <td>{{ player.nVictories }}</td>
                    <td>{{ player.nDefeats }}</td>
                    <td>{{ player.totalDamageReceived }}</td>
                    <td>{{ player.totalDamageDealt }}</td>
                    <td>{{ getPlayerVisitedTilesRatio(player) }}%</td>
                </tr>
            }
        </tbody>
    </table>
</div>
