<div id="grid-container" class="flex items-center h-full w-full justify-center p-4">
    <div
        #grid
        class="grid bg-gray-400 w-[min(100cqw,100cqh)] h-[min(100cqw,100cqh)] select-none"
        [ngClass]="'grid-' + activeGameService.activeGame.game.board.cells.length"
    >
        @for (row of activeGameService.activeGame.game.board.cells; track $index; let rowIndex = $index) {
            @for (cell of row; track $index; let colIndex = $index) {
                <app-edition-cell
                    [cellType]="cell"
                    [rowIndex]="rowIndex"
                    [colIndex]="colIndex"
                    [item]="boardSharedService.getObjectAt(rowIndex, colIndex, activeGameService.activeGame.game.board.items)"
                ></app-edition-cell>
            }
        }
    </div>
</div>
