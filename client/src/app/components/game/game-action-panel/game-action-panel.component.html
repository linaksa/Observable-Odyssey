<div class="text-2xl text-white tracking-wider text-center">Actions</div>

<div class="flex min-h-0 flex-1 flex-col gap-4">
    <div class="min-h-0 flex-1 overflow-y-auto">
        <app-game-player-card class="block w-full" [player]="localPlayer()" />
    </div>

    <app-game-action-controls
        class="shrink-0"
        [currentTurnPlayerName]="currentTurnPlayerName()"
        [showTurnTimer]="showTurnTimer"
        [turnTimeLeftSeconds]="turnTimeLeftSeconds()"
        [isTurnPreparing]="isTurnPreparing"
        [isInCombat]="isInCombat"
        [combatStatus]="combatStatus"
        [canEndTurn]="canEndTurn"
        [canToggleActionMode]="canToggleActionMode"
        [actionMode]="actionMode()"
        [isGameFinished]="isGameFinished"
        [isLocalPlayerTurn]="isLocalPlayerTurn"
        [localPlayerHasActionLeft]="localPlayerHasActionLeft()"
        (endTurnRequested)="endTurn()"
        (toggleActionModeRequested)="toggleActionMode()"
    />
</div>
