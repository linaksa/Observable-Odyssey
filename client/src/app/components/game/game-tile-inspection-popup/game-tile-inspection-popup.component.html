@if (data().visible) {
    <aside
        #tooltipElement
        class="fixed z-[2147483647] w-72 rounded-xl border border-[#4a7fd4] bg-[#0f1528] p-4 text-white/85 shadow-2xl pointer-events-none"
        [style.left.px]="position().x"
        [style.top.px]="position().y"
        (click)="$event.stopPropagation()"
        (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
    >
        <h4 class="text-base font-semibold tracking-wide">{{ data().title }}</h4>
        <p class="mt-1 text-sm text-white/70">{{ data().description }}</p>
        <p class="mt-2 text-sm"><span class="font-medium">Coût déplacement :</span> {{ data().movementCost }}</p>

        @if (data().playerName) {
            <hr class="my-3 border-white/20" />
            <div class="flex items-center gap-2">
                @if (data().playerAvatarUrl) {
                    <img
                        class="h-10 w-10 rounded-full object-cover [image-rendering:pixelated]"
                        [src]="data().playerAvatarUrl"
                        [alt]="'Avatar de ' + data().playerName"
                    />
                }
                <p class="text-sm font-medium">{{ data().playerName }}</p>
            </div>
        }
    </aside>
}
