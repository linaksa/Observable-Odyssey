@if (data().visible) {
    <div
        class="absolute left-1/2 top-1/2 z-50 w-72 -translate-x-1/2 -translate-y-1/2 rounded-lg border border-gray-300 bg-white p-4 shadow-xl"
        (click)="$event.stopPropagation()"
        (contextmenu)="$event.preventDefault(); $event.stopPropagation()"
    >
        <h4 class="mb-2 text-base font-semibold text-gray-900">{{ data().title }} :</h4>
        <p class="mb-3 text-sm text-gray-700">{{ data().description }}</p>
        <p class="mb-4 text-sm text-gray-800"><span class="font-medium">Choix du sanctuaire :</span> {{ data().effectLabel }}</p>

        <div class="flex flex-wrap gap-2">
            <button
                type="button"
                class="rounded-md border border-emerald-700 bg-emerald-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-emerald-700"
                data-testid="sanctuary-standard-choice"
                (click)="choiceSelected.emit('standard')"
            >
                1x (100%)
            </button>
            <button
                type="button"
                class="rounded-md border border-amber-700 bg-amber-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-amber-700"
                data-testid="sanctuary-double-choice"
                (click)="choiceSelected.emit('double')"
            >
                2x (50%)
            </button>
            <button
                type="button"
                class="rounded-md border border-gray-400 bg-gray-200 px-3 py-2 text-sm font-medium text-gray-800 transition hover:bg-gray-300"
                data-testid="sanctuary-cancel-choice"
                (click)="cancel.emit()"
            >
                Annuler
            </button>
        </div>
    </div>
}
