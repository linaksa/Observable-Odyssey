@if (data().visible) {
    <div class="absolute inset-0 z-1000 flex items-center justify-center overflow-y-auto rounded-lg bg-black/70 p-4 backdrop-blur-sm">
        <section class="w-full max-w-120 overflow-hidden rounded-2xl border-[2.5px] border-[#4a7fd4] bg-[#1a3260] shadow-2xl">
            <header class="flex items-center justify-between gap-3 border-b-2 border-[#4a7fd4] bg-[#162b55] px-4 py-3">
                <span class="text-[9px] font-bold uppercase tracking-widest text-[#a8c8ff]">☘ Sanctuaire</span>
                <span
                    class="rounded-lg border-[1.5px] border-[#4a7fd4] bg-[#0d1f42] px-3 py-1.5 text-center font-bold tracking-wide text-[#e8f0ff] text-base"
                >
                    {{ data().title }}
                </span>
            </header>

            <div class="flex flex-col gap-4 p-5" (click)="$event.stopPropagation()" (contextmenu)="$event.preventDefault(); $event.stopPropagation()">
                <div class="text-center">
                    <h4 class="text-2xl font-bold tracking-wide text-[#e8f0ff]">{{ data().description }}</h4>
                    <p class="mt-2 text-sm text-[#c8dcff]">{{ data().effectLabel }}</p>
                </div>

                <div class="grid gap-3">
                    <button
                        type="button"
                        class="flex w-full items-center justify-between gap-3 rounded-xl border-2 border-[#2d5199] bg-[#1a3365] px-3 py-2.5 text-left select-none text-[#a8c8ff] transition-all duration-150 hover:border-[#4a7fd4] hover:bg-[#1e3d75] active:scale-95"
                        data-testid="sanctuary-standard-choice"
                        (click)="choiceSelected.emit(sanctuaryChoice.Standard)"
                    >
                        <span class="text-base font-bold tracking-wide text-[#e8f0ff]">1x</span>
                        <span class="text-sm font-semibold opacity-80">100% de chance</span>
                    </button>

                    <button
                        type="button"
                        class="flex w-full items-center justify-between gap-3 rounded-xl border-2 border-[#7a3d0a] bg-[#2a1500] px-3 py-2.5 text-left select-none text-[#f5b060] transition-all duration-150 hover:border-[#b06020] hover:bg-[#3a1e00] active:scale-95"
                        data-testid="sanctuary-double-choice"
                        (click)="choiceSelected.emit(sanctuaryChoice.Double)"
                    >
                        <span class="text-base font-bold tracking-wide text-[#e8f0ff]">2x</span>
                        <span class="text-sm font-semibold opacity-80">50% de chance</span>
                    </button>

                    <button
                        type="button"
                        class="flex w-full items-center justify-between gap-3 rounded-xl border-2 border-[#6b6b6b] bg-[#d7d7d7] px-3 py-2.5 text-left select-none text-[#1f1f1f] transition-all duration-150 hover:bg-[#c9c9c9] active:scale-95"
                        data-testid="sanctuary-cancel-choice"
                        (click)="cancel.emit()"
                    >
                        <span class="text-base font-bold tracking-wide">Annuler</span>
                        <span class="text-sm font-semibold opacity-80">Aucun point d'action consommé</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between gap-3 border-t-2 border-[#4a7fd4] bg-[#0d1f42] px-4 py-2">
                <span class="text-[9px] font-bold uppercase tracking-[3px] text-[#a8c8ff]">Temps restant</span>
            </div>

            <div class="h-[3px] bg-[#0d1f42]">
                <div
                    class="h-full bg-linear-to-r from-[#4a7fd4] to-[#e8a832] transition-[width] duration-1000 ease-linear"
                    [style.width.%]="turnTimerPercent()"
                ></div>
            </div>
        </section>
    </div>
}
